[project]
name = "aw-import-harvest"
version = "0.1.0"
description = "Import Harvest time entries into ActivityWatch"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.9",
    "rich>=13",
    "requests>=2.31",
    "aw-client>=0.5.14",
]

[project.scripts]
aw-import-harvest = "aw_import_harvest:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aw_import_harvest"]

[project.optional-dependencies]
test = ["pytest>=7"]
